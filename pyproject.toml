[project]
name = "ctreepo"
version = "0.4.0"
description = "CTreePO - configuration tree patch overview - Parsing, filtering and diff calculation for network device configurations"
authors = [{ name = "Alexander Ignatov", email = "alexigna@ozon.ru" }]
license = "Apache-2.0"
readme = "README.md"
keywords = [
  "cisco",
  "arista",
  "huawei",
  "network",
  "automation",
  "configuration",
]
requires-python = ">=3.11,<4.0"
dependencies = ["pyyaml (>=6.0.2,<7.0.0)"]


[tool.poetry]
packages = [{ include = "ctreepo", from = "src" }]


[tool.poetry.group.dev.dependencies]
ipython = "^9.4.0"
black = "^25.1.0"
ruff = "^0.12.4"
mypy = "^1.17.0"
pytest = "^8.4.1"
pytest-cov = "^6.2.1"
types-pyyaml = "^6.0.12.20250516"
pytest-mock = "^3.15.1"
snakeviz = "^2.2.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 120


[tool.ruff]
# https://docs.astral.sh/ruff/settings
extend-exclude = ["__init__.py"]
line-length = 120
lint.pydocstyle.convention = "google"
lint.select = [
  "N", #pep8-naming
  "B", #flake8-bugbear
  "A", #flake8-builtins
  "E", #pycodestyle.error
  "W", #pycodestyle.warning
  "F", #pyflakes
  "S", #flake8-bandit
  "D", #pydocstyle
  "I", #isort
  # "C90", # maccabe
  "C4",   # flake8-comprehensions
  "COM",  # flake8-commas
  "DTZ",  # flake8-datetimez
  "ERA",  # flake8-eradicate
  "SLOT", # flake8-slots

  # "EXE", # flake8-executable
  # "FBT", # flake8-boolean-trap
  # 
  "FLY",  # pyflint
  "FURB", # refurb
  "G",    # flake8-logging-format
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  # "PERF", # perflint
  "PIE", # flake8-pie
  # "PL",   # pylint
  # "PT",  # flake8-pytest-style
  # "PTH", # flake8-use-pathlib
  # "PYI", # flake8-pyi
  "Q", # flake8-quotes
  # "RET", # flake8-return
  "RSE", # flake8-raise
  # "RUF", # ruff
  # "SIM",  # flake8-simpify
  # "SLF", # flake8-self
  # "T100", # flake8-debugger
  # "TRY",  # tryceratops
  # "UP",  # pyupgrade
  "YTT", # flake8-2020
  "UP",  # pyupgrade
]
lint.ignore = [
  "D100",   # Missing docstring in public module
  "D101",   # Missing docstring in public class
  "D102",   # Missing docstring in public method
  "D103",   # Missing docstring in public function
  "D105",   # Missing docstring in magic method
  "D106",   # Missing docstring in public nested class
  "D107",   # Missing docstring in `__init__`
  "S101",   # Use of `assert` detected
  "S311",   # Standard pseudo-random generators are not suitable for cryptographic purposes
  "ERA001", # Remove commented-out code
]


[tool.pytest.ini_options]
addopts = """
  -vv
  -s
  -ra
  --strict-markers
"""
testpaths = ["./tests/"]
xfail_strict = true
# filterwarnings = ["ignore::DeprecationWarning"]
# настройки cov в makefile прописаны, если тут оставлять,
# то ломается debug тестов через VSC
#   --cov src
#   --cov-report term
#   --cov-report html
#   --cov-report xml:coverage.xml
#   --cov-fail-under=80

[tool.coverage.run]
branch = true

[tool.coverage.report]
skip_empty = true
omit = [
  # omit anything in a .local directory anywhere
  '*/.local/*',
  '__init__.py',
  'tests/*',
  '*/tests/*',
  # omit anything in a .venv directory anywhere
  '.venv/*',
]
exclude_also = [
  # исключаем main секцию вместо # pragma: no cover
  'if __name__ == .__main__.:',
]


[tool.mypy]
strict = true
